site_name: itis-sumo
site_description: Headless surrogate-modeling (SuMo) core — build, evaluate, cross-validate, and interrogate surrogate models
repo_url: https://github.com/ITISFoundation/itis-sumo
site_url: https://itisfoundation.github.io/itis-sumo/
edit_uri: ""

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_object_full_path: false
            show_source: false
            heading_level: 3

extra_css:
  - assets/css/workflow.css
  - assets/css/fonts.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

copyright: © IT'IS Foundation

nav:
  - Home: index.md
  - Quick Start:
      - Getting started: tutorials/getting-started.md
      - Worked examples: tutorials/examples.md
  - Workflows:
      - Cross-validate a surrogate: how-to/cross-validate.md
      - Run a sensitivity analysis: how-to/sensitivity-analysis.md
      - Find a Pareto front with MOGA: how-to/moga.md
      - Scale & preprocessing: how-to/preprocess.md
  - Reference:
      - Overview: reference/index.md
      - Glossary: reference/glossary.md
      - SuMo handle: reference/su-mo.md
      - Function modules: reference/functions.md
      - Types & errors: reference/types.md
      - Report renderings: reference/report.md
      - Engine internals: reference/engine.md
  - Background:
      - Why surrogate modeling: explanation/surrogate-modeling.md
      - How Gaussian Processes work: explanation/gaussian-processes.md
  - About:
      - Overview: about/index.md
      - Provenance / Porting: about/porting.md
      - Spec (living design doc): about/spec.md
