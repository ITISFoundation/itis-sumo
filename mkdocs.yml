site_name: itis-sumo
site_description: Headless surrogate-modeling (SuMo) core — build, evaluate, cross-validate, and interrogate surrogate models
repo_url: https://github.com/ITISFoundation/itis-sumo
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Theory & Background:
      - Why surrogate modeling: theory/surrogate-modeling.md
      - How Gaussian Processes work: theory/gaussian-processes.md
      - Worked examples: theory/examples.md
  - Algorithms:
      - Overview: algorithms/index.md
      - Dakota engine core: algorithms/core.md
      - Config (NIDR composers): algorithms/config.md
      - Sampling: algorithms/sampling.md
      - Surrogate evaluation & cross-validation: algorithms/evaluate.md
      - Sensitivity (Sobol) & UQ propagation: algorithms/sensitivity-uq.md
      - MOGA optimization: algorithms/moga.md
      - Data preprocessing: algorithms/preprocess.md
  - Verification & Validation:
      - Report: verification-validation.md
      - Test plan (source): VERIFICATION_VALIDATION_PLAN.md
      - Unit/property test plan: TIER1_TIER2_UNIT_TESTS_PLAN.md
  - Provenance / Porting: porting.md
  - Spec (living design doc): spec.md
