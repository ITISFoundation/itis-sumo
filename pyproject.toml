[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "itis-sumo"
version = "0.1.0"
description = "Surrogate Modeling functionality for IT'IS Foundation / ZMT Modeling Intelligence suite: build, evaluate, cross-validate surrogates + UQ + sampling, headless or embedded"
readme = "README.md"
# T55kd: the 6.24.13 engine wheel matrix is cp312-cp314 (6.24.8 dropped cp311,
# cp314 wheels exist only in 6.24.x) -> floor 3.12, ceiling lifted for 3.14.
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Javier Garcia Ordonez", email = "ordonez@itis.swiss" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # T55kd: itis-dakota==6.24.7 -> 6.24.13. First 6.24.x shipping win_amd64
    # wheels (6.24.13, 2026-10-06) -> Windows is a supported platform; same
    # Dakota 6.24 engine line, packaging/fix releases since .7. Crosses the
    # 6.24.8 cp311 drop: py floor 3.11 -> 3.12 (SPEC §C py; mmux/vite parity
    # re-anchored to 1.5.11, owner call 2026-10-14). The 6.23+ `interface_cache`
    # regression (SPEC §R5) is still upstream in 6.24.13 (`.at()` throw, not the
    # pending get-or-create fix) and stays shimmed in-repo via
    # `add_r5_interface_cache_workaround()` in config/funs_create_dakota_conf.py;
    # shim re-verified on the real wheel: analytical suite 26/26 on py3.14.
    "itis-dakota==6.24.13",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.0,<3.0",
    "scikit-learn>=1.6,<2.0",
    "scipy>=1.15,<2.0",
]

[project.urls]
Homepage = "https://github.com/ITISFoundation/itis-sumo"
Repository = "https://github.com/ITISFoundation/itis-sumo.git"
Issues = "https://github.com/ITISFoundation/itis-sumo/issues"
Documentation = "https://itisfoundation.github.io/itis-sumo/"

[project.scripts]
itis-sumo = "itis_sumo.cli:main"



[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "matplotlib>=3.8,<4.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ty.src]
# examples/ needs the `docs` dependency group (matplotlib) which isn't part of
# `--all-extras --dev`; it's exercised separately via `make docs-figures`.
exclude = ["examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "analytical: marks tests that spawn a real Dakota subprocess against known analytical functions",
]
