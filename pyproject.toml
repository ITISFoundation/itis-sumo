[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "itis-sumo"
version = "0.1.0a2"
description = "Surrogate Modeling functionality for IT'IS Foundation / ZMT Modeling Intelligence suite: build, evaluate, cross-validate surrogates + UQ + sampling, headless or embedded"
readme = "README.md"
# T16mo rung 1 (1.5.9->1.5.11): 1.5.11 ships cp313 wheels, so the <3.13
# ceiling from the 1.5.9-only wheel matrix no longer applies.
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Javier Garcia Ordonez", email = "ordonez@itis.swiss" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # T16mo rung 1: itis-dakota==1.5.11 (still Dakota 6.20, packaging-only
    # bump -- behavior-identical to 1.5.9). Stay on 6.20 until the 6.23+
    # `Interface::interface_cache()` regression is resolved (SPEC §T T16mo
    # rung 2). 1.5.9 itself was removed from PyPI (SPEC §B).
    "itis-dakota==1.5.11",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.0,<3.0",
    "scikit-learn>=1.6,<2.0",
    "scipy>=1.15,<2.0",
    "typing-extensions>=4.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ITISFoundation/itis-sumo"
Repository = "https://github.com/ITISFoundation/itis-sumo.git"
Issues = "https://github.com/ITISFoundation/itis-sumo/issues"
Documentation = "https://itisfoundation.github.io/itis-sumo/"

[project.scripts]
itis-sumo = "itis_sumo.cli:main"



[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "tomli>=2.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "matplotlib>=3.8,<4.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ty.src]
# examples/ needs the `docs` dependency group (matplotlib) which isn't part of
# `--all-extras --dev`; it's exercised separately via `make docs-figures`.
exclude = ["examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "analytical: marks tests that spawn a real Dakota subprocess against known analytical functions",
]
