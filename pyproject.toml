[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "itis-sumo"
version = "0.1.0a1.dev1"
description = "Surrogate Modeling functionality for IT'IS Foundation / ZMT Modeling Intelligence suite: build, evaluate, cross-validate surrogates + UQ + sampling, headless or embedded"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Javier Garcia Ordonez", email = "ordonez@itis.swiss" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Parity with mmux/vite flaskapi (itis-dakota==1.5.9, Dakota 6.20). Stay
    # here until the 6.23+ `Interface::interface_cache()` regression on
    # interface-less surrogate confs is resolved (see SPEC §T T16mo ladder).
    "itis-dakota==1.5.9",
    "numpy>=2.0,<3.0",
    "pandas>=3.0,<4.0",
    "pydantic>=2.0,<3.0",
    "scikit-learn>=1.6,<2.0",
    "scipy>=1.15,<2.0",
]

[project.urls]
Homepage = "https://github.com/ITISFoundation/itis-sumo"
Repository = "https://github.com/ITISFoundation/itis-sumo.git"
Issues = "https://github.com/ITISFoundation/itis-sumo/issues"
Documentation = "https://itisfoundation.github.io/itis-sumo/"

[project.scripts]
itis-sumo = "itis_sumo.cli:main"



[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "matplotlib>=3.8,<4.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "analytical: marks tests that spawn a real Dakota subprocess against known analytical functions",
]
