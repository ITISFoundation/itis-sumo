[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "itis-sumo"
dynamic = ["version"]
description = "MetaModeling (Surrogate Model) core: build, evaluate, cross-validate surrogates + UQ + sampling, headless or embedded"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Javier Garcia Ordonez", email = "ordonez@zmt.swiss" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Parity with mmux/vite flaskapi (itis-dakota==1.5.9, Dakota 6.20). Stay
    # here until the 6.23+ `Interface::interface_cache()` regression on
    # interface-less surrogate confs is resolved (see SPEC §T T16mo ladder).
    "itis-dakota==1.5.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.0",
    "scikit-learn>=1.6",
    "scipy>=1.15",
]

[project.urls]
Homepage = "https://github.com/ITISFoundation/itis-sumo"
Repository = "https://github.com/ITISFoundation/itis-sumo.git"
Issues = "https://github.com/ITISFoundation/itis-sumo/issues"
Documentation = "https://itisfoundation.github.io/itis-sumo/"

[project.scripts]
itis-sumo = "itis_sumo.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/itis_sumo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/itis_sumo"]

[tool.hatch.build.targets.wheel.force-include]
"src/itis_sumo/py.typed" = "itis_sumo/py.typed"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.58",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "analytical: marks tests that spawn a real Dakota subprocess against known analytical functions",
]
