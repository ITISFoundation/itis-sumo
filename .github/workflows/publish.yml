name: Publish

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish and optionally release"
        required: true
      registry:
        description: "Package index to publish to"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: pypi

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build sdist + wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Needed so tests/ (not shipped in the wheel) is present to exercise
      # the installed wheel against; must run before download-artifact
      # since checkout's default `git clean` would wipe an existing dist/.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas pydantic scikit-learn scipy itis-dakota==1.5.9

      - name: Install wheel and run tests
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pytest


  # Configure Trusted Publishers for this workflow in both package indexes:
  # environment `testpypi` for alpha releases and `pypi` for stable releases.
  # No API token is stored here.
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.registry }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Validate dispatch tag and artifact version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          registry="${{ inputs.registry }}"
          if [[ "$registry" == "testpypi" ]]; then
            tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+a[0-9]+$'
          else
            tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          [[ "$RELEASE_TAG" =~ $tag_pattern ]] || {
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          }
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          artifact_version=$(unzip -p "$wheel" '*/METADATA' | sed -n 's/^Version: //p')
          expected_version="${RELEASE_TAG#v}"
          [[ "$artifact_version" == "$expected_version" ]] || {
            echo "Tag $RELEASE_TAG does not match artifact version $artifact_version"
            exit 1
          }

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  release:
    needs: publish
    if: github.event_name == 'workflow_dispatch' && inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate changelog for this tag
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: dist/*
