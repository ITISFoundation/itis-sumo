name: Publish

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish to PyPI and cut a GitHub Release for"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build sdist + wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Needed so tests/ (not shipped in the wheel) is present to exercise
      # the installed wheel against; must run before download-artifact
      # since checkout's default `git clean` would wipe an existing dist/.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas pydantic scikit-learn scipy itis-dakota==1.5.9

      - name: Install wheel and run tests
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pytest


  # Trusted Publisher must be configured once on the PyPI project's "Publishing"
  # settings page (pending-publisher works before the first release exists),
  # pointing at this repo/workflow/environment. No API token is stored here.
  #
  # Gated to manual dispatch only: CI verifies the built alpha/beta/rc
  # artifact, while feature-branch .dev versions are uploaded locally by
  # make publish-testpypi-dev. Going out to real PyPI (and cutting a GitHub
  # Release) requires an explicit "Run workflow" dispatch naming the tag.
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Validate dispatch tag and artifact version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+)?$ ]] || {
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          }
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          artifact_version=$(unzip -p "$wheel" '*/METADATA' | sed -n 's/^Version: //p')
          expected_version="${RELEASE_TAG#v}"
          [[ "$artifact_version" == "$expected_version" ]] || {
            echo "Tag $RELEASE_TAG does not match artifact version $artifact_version"
            exit 1
          }

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate changelog for this tag
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: dist/*
