name: Publish

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish and optionally release"
        required: true
      registry:
        description: "Package index to publish to"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: pypi

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build sdist + wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Needed so tests/ (not shipped in the wheel) is present to exercise
      # the installed wheel against; must run before download-artifact
      # since checkout's default `git clean` would wipe an existing dist/.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Install wheel and run unit-tests
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python -m pip install "$wheel"
          python -m pytest -m "not integration and not analytical"

      # V54hz keeps plotly+marimo out of core, so the built wheel's own metadata is the ONLY way a
      # consumer learns the extra exists. Asserted by PARSING that metadata, not grepping it: the first
      # version demanded `extra == "report"` while hatchling writes `extra == 'report'`, so the guard
      # could never match the artifact it guards — `v0.2.0a16` died on a CORRECT wheel (B29jm), and
      # `a14`/`a15` had died one step earlier on B27qx's collection error, which is what hid this third
      # defect in the same chain. tests/repo/test_publish_metadata_check.py runs the block below
      # verbatim, over METADATA as the build actually emits it: an assertion never rehearsed against
      # the artifact it asserts is B27qx's lesson, applied to the release path (V58dq).
      - name: Report-deps are available
        run: |
          set -euo pipefail
          python - "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" <<'PY'
          # check:report-extra:start — everything between the two sentinels is executed by
          # tests/repo/test_publish_metadata_check.py; keep it dependency-free stdlib.
          import re
          import sys
          import zipfile
          from email import message_from_string
          from pathlib import Path

          WANTED = {"plotly", "marimo"}
          # Quote- and spacing-insensitive on purpose: which of them the backend chooses is the
          # backend's business (B29jm), and continuation headers (the multi-line License:) are why
          # this parses headers instead of scanning lines.
          MARKER = re.compile(r"""extra\s*==\s*['\"]report['\"]""")

          with zipfile.ZipFile(Path(sys.argv[1])) as archive:
              name = next(n for n in archive.namelist() if n.endswith("/METADATA"))
              metadata = message_from_string(archive.read(name).decode("utf-8"))

          extras = [value.strip().lower() for value in metadata.get_all("Provides-Extra", [])]
          if "report" not in extras:
              sys.exit(f"built wheel advertises no [report] extra (Provides-Extra: {extras})")

          gated = set()
          for value in metadata.get_all("Requires-Dist", []):
              if MARKER.search(value.partition(";")[2]):
                  gated.add(re.split(r"[<>=!~;[ ]", value, maxsplit=1)[0].strip().lower())

          missing = sorted(WANTED - gated)
          if missing:
              sys.exit(
                  f"built wheel's [report] extra advertises none of {', '.join(missing)};"
                  f" found {', '.join(sorted(gated)) or 'nothing'} — presentation deps belong in"
                  " [project.optional-dependencies].report (V54hz)"
              )
          print(f"[report] extra carries {sorted(WANTED & gated)}")
          # check:report-extra:end
          PY


  # Configure Trusted Publishers for this workflow in both package indexes:
  # environment `testpypi` for alpha releases and `pypi` for stable releases.
  # No API token is stored here.
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.registry }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Validate dispatch tag and artifact version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          registry="${{ inputs.registry }}"
          if [[ "$registry" == "testpypi" ]]; then
            tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+a[0-9]+$'
          else
            tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          [[ "$RELEASE_TAG" =~ $tag_pattern ]] || {
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          }
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          artifact_version=$(unzip -p "$wheel" '*/METADATA' | sed -n 's/^Version: //p')
          expected_version="${RELEASE_TAG#v}"
          [[ "$artifact_version" == "$expected_version" ]] || {
            echo "Tag $RELEASE_TAG does not match artifact version $artifact_version"
            exit 1
          }

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  release:
    needs: publish
    if: github.event_name == 'workflow_dispatch' && inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate changelog for this tag
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: softprops/action-gh-release@v3
        with:
          # workflow_dispatch runs carry a branch ref (GITHUB_REF_NAME=main), so
          # softprops' auto-detection finds no tag ("GitHub Releases requires a
          # tag", B24qz) — the dispatch input is the tag's source of truth.
          tag_name: ${{ inputs.tag }}
          body: ${{ steps.changelog.outputs.content }}
          files: dist/*
