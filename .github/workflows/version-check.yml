name: Check release version

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**/*.md"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Validate target-branch version channel
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          uv run --no-project --with packaging python - "$BASE_REF" <<'PY'
          import subprocess
          import sys
          import tomllib
          from packaging.version import Version

          target = sys.argv[1]
          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          parsed = Version(version)
          if target == "develop":
              if parsed.pre is None or parsed.pre[0] != "a":
                  raise SystemExit(
                      f"PR target {target} requires an alpha prerelease, found {version}"
                  )
          elif target == "main":
              if parsed.is_prerelease:
                  raise SystemExit(
                      f"PR target {target} requires a stable release, found {version}"
                  )
          else:
              raise SystemExit(f"unsupported PR target: {target}")

          tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
          candidate = Version(version)
          for tag in tags:
              try:
                  tagged = Version(tag.removeprefix("v"))
              except Exception:
                  continue
              if tagged >= candidate:
                  raise SystemExit(f"version {version} is not newer than existing tag {tag}")
          print(f"{target}: {version} is a valid newer release")
          PY
