name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Type check
        # 22 pre-existing `ty` errors in tests/lhs.py predate this workflow (see
        # Task 1.6 follow-up); non-blocking until that debt is cleaned up.
        run: uv run ty check
        continue-on-error: true

      - name: Test
        run: uv run pytest
