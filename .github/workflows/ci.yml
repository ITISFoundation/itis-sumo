name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      py: ${{ steps.filter.outputs.py }}
      md: ${{ steps.filter.outputs.md }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed file types
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ "$base_sha" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$head_sha")"
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          py=false
          md=false
          ci=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              .github/workflows/*)
                ci=true
                ;;
              *.py|pyproject.toml|uv.lock)
                py=true
                ;;
              *.md|mkdocs.yml)
                md=true
                ;;
            esac
          done <<< "$changed_files"

          {
            echo "py=$py"
            echo "md=$md"
            echo "ci=$ci"
          } >> "$GITHUB_OUTPUT"

  prek:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.py == 'true' || needs.detect_changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run prek
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ "$base_sha" =~ ^0+$ ]]; then
            changed_py_files="$(git diff-tree --no-commit-id --name-only -r "$head_sha" | grep -E '\.py$' || true)"
          else
            changed_py_files="$(git diff --name-only "$base_sha" "$head_sha" | grep -E '\.py$' || true)"
          fi

          if [[ -z "$changed_py_files" ]]; then
            echo "No Python files changed; skipping prek"
            exit 0
          fi

          printf '%s\n' "$changed_py_files" | xargs uv run ruff check
          printf '%s\n' "$changed_py_files" | xargs uv run ruff format --check

  unit_tests:
    runs-on: ubuntu-latest
    needs:
      - detect_changes
      - prek
    if: needs.detect_changes.outputs.py == 'true' || needs.detect_changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        run: uv run pytest -m "not integration and not analytical"

  integration_analytical_tests:
    runs-on: ubuntu-latest
    needs:
      - detect_changes
      - unit_tests
    if: needs.detect_changes.outputs.py == 'true' || needs.detect_changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run integration and analytical tests
        run: uv run pytest -m "integration or analytical"

  docs:
    runs-on: ubuntu-latest
    needs:
      - detect_changes
      - integration_analytical_tests
    if: ${{ always() && (needs.detect_changes.outputs.md == 'true' || needs.detect_changes.outputs.ci == 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Build docs
        run: uv run --group docs mkdocs build --strict
