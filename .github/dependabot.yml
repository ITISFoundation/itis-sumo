version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Engine bumps are a wheel-matrix decision (py floor, platform coverage,
    # R5-shim re-verification on the real wheel — SPEC V20qx/R5, T16mo rung
    # ladder), not a bot auto-bump.
    ignore:
      - dependency-name: "itis-dakota"
