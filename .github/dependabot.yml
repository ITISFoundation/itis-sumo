version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Keep pinned until T16mo resolves the Dakota 6.23+ interface-cache regression.
    ignore:
      - dependency-name: "itis-dakota"
